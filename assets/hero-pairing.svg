<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="同一个审批请求，桌面上有对话框，120 秒没有应答后才到手机">
  <title>桌面优先，手机兜底（样张）</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3370ff"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#0f1115"/>

  <text x="40" y="48" font-size="19" font-weight="600" fill="#e8eaed" font-family="Segoe UI, Microsoft YaHei, Arial">一个请求，两个可以作答的地方</text>
  <text x="40" y="74" font-size="12.5" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">桌面先拿到它；手机只在桌面沉默满 120 秒之后才被打扰。两边都能答，先答的生效。</text>

  <!-- ── desktop: DSH Web GUI ───────────────────────────── -->
  <rect x="40" y="98" width="500" height="440" rx="10" fill="#141821" stroke="#2a2f3a"/>
  <circle cx="62" cy="120" r="5" fill="#3a4150"/>
  <circle cx="80" cy="120" r="5" fill="#3a4150"/>
  <circle cx="98" cy="120" r="5" fill="#3a4150"/>
  <rect x="120" y="110" width="300" height="20" rx="10" fill="#1b2029"/>
  <text x="132" y="124" font-size="10" fill="#7c8698" font-family="Consolas, Menlo, monospace">127.0.0.1:3080</text>

  <rect x="64" y="152" width="452" height="336" rx="10" fill="#1b2029" stroke="#2a2f3a"/>

  <text x="84" y="186" font-size="14" font-weight="600" fill="#e8eaed" font-family="Segoe UI, Microsoft YaHei, Arial">工具审批</text>
  <text x="84" y="210" font-size="10.5" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">桌面与手机同时可答，先到者生效。批准仅对本次调用生效。</text>

  <text x="84" y="240" font-size="10" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">工具</text>
  <rect x="84" y="250" width="412" height="52" rx="7" fill="#11141a" stroke="#2a2f3a"/>
  <text x="96" y="272" font-size="11" font-family="Consolas, Menlo, monospace" fill="#e8eaed">bash: rm -rf ./dist &amp;&amp; pnpm build</text>
  <text x="96" y="291" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#9aa3b2">cwd: /srv/app/checkout</text>

  <text x="84" y="326" font-size="10" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">调用 ID</text>
  <text x="84" y="345" font-size="11" font-family="Consolas, Menlo, monospace" fill="#e8eaed">call_01HZX8K3M2Q</text>

  <text x="84" y="374" font-size="10" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">原因</text>
  <text x="84" y="393" font-size="11" fill="#e8eaed" font-family="Segoe UI, Microsoft YaHei, Arial">删除构建产物目录，属于破坏性操作</text>

  <line x1="64" y1="428" x2="516" y2="428" stroke="#2a2f3a"/>

  <rect x="84" y="442" width="200" height="32" rx="8" fill="none" stroke="#3a4150"/>
  <text x="184" y="463" font-size="12" fill="#c8cdd8" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">拒绝</text>
  <rect x="296" y="442" width="200" height="32" rx="8" fill="#3370ff"/>
  <text x="396" y="463" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">批准一次</text>

  <text x="40" y="566" font-size="12" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">在这里答了，手机全程不会被碰。</text>
  <text x="40" y="588" font-size="10.5" fill="#5b6474" font-family="Segoe UI, Microsoft YaHei, Arial">对话框就是 DSH 原有的审批界面，插件没有改它。</text>

  <!-- ── arrow: the timer ───────────────────────────────── -->
  <line x1="552" y1="300" x2="646" y2="300" stroke="#3370ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="599" y="272" font-size="12.5" font-weight="600" fill="#3370ff" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">120 s</text>
  <text x="599" y="290" font-size="10" fill="#5b6474" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">无人应答</text>
  <text x="599" y="330" font-size="10.5" fill="#7c8698" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">delaySeconds</text>
  <text x="599" y="346" font-size="10.5" fill="#7c8698" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">可设为 0</text>

  <!-- ── phone: Feishu ──────────────────────────────────── -->
  <rect x="658" y="110" width="300" height="600" rx="34" fill="#1f2329"/>
  <rect x="670" y="122" width="276" height="576" rx="24" fill="#f7f8fa"/>
  <rect x="772" y="130" width="72" height="9" rx="4.5" fill="#1f2329" opacity="0.8"/>

  <text x="808" y="170" font-size="14" font-weight="600" fill="#1f2329" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">工具审批</text>
  <text x="808" y="190" font-size="10" fill="#646a73" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">桌面 120 秒内未应答，已升级到手机。</text>

  <rect x="694" y="206" width="228" height="56" rx="8" fill="#ffffff" stroke="#e5e6eb"/>
  <text x="706" y="228" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#1f2329">bash: rm -rf ./dist</text>
  <text x="706" y="245" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#646a73">cwd: /srv/app/checkout</text>

  <text x="694" y="290" font-size="10" fill="#8f959e" font-family="Segoe UI, Microsoft YaHei, Arial">调用 ID</text>
  <text x="694" y="308" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#1f2329">call_01HZX8K3M2Q</text>

  <text x="694" y="336" font-size="10" fill="#8f959e" font-family="Segoe UI, Microsoft YaHei, Arial">原因</text>
  <text x="694" y="354" font-size="10.5" fill="#646a73" font-family="Segoe UI, Microsoft YaHei, Arial">删除构建产物目录，属于破坏性操作</text>

  <rect x="694" y="628" width="228" height="36" rx="8" fill="#ffffff" stroke="#d0d3d9"/>
  <text x="808" y="651" font-size="12" fill="#1f2329" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">拒绝</text>
  <rect x="694" y="672" width="228" height="36" rx="8" fill="#3370ff"/>
  <text x="808" y="695" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">批准一次</text>

  <text x="808" y="742" font-size="12" fill="#9aa3b2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">点一下，Agent 立刻继续</text>
  <text x="808" y="762" font-size="10.5" fill="#5b6474" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">飞书长连接投递，无需公网入口</text>
</svg>
