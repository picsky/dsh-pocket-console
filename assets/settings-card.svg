<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-label="设置页：Pocket console 卡片，未绑定状态、升级设置与待处理请求">
  <title>设置卡片（样张）</title>
  <rect width="640" height="830" fill="#0f1115"/>

  <text x="32" y="44" font-size="15" font-weight="600" fill="#e8eaed" font-family="Segoe UI, Microsoft YaHei, Arial">Settings → Plugins → Plugin configuration</text>

  <rect x="32" y="64" width="576" height="648" rx="12" fill="#171a21" stroke="#2a2f3a"/>

  <!-- card head -->
  <text x="56" y="104" font-size="16" font-weight="600" fill="#e8eaed" font-family="Segoe UI, Microsoft YaHei, Arial">Pocket console</text>
  <text x="56" y="128" font-size="11.5" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">Send tool approvals and questions to your phone, with the desktop</text>
  <text x="56" y="145" font-size="11.5" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">always first in line.</text>

  <rect x="486" y="88" width="98" height="24" rx="12" fill="#2a2f3a"/>
  <text x="535" y="104" font-size="11" fill="#9aa3b2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">Not bound</text>

  <line x1="32" y1="170" x2="608" y2="170" stroke="#2a2f3a"/>

  <!-- binding -->
  <text x="56" y="204" font-size="12.5" font-weight="600" fill="#c8cdd8" font-family="Segoe UI, Microsoft YaHei, Arial">Feishu binding</text>

  <rect x="56" y="220" width="160" height="32" rx="8" fill="#3370ff"/>
  <text x="136" y="241" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">Scan to create an app</text>

  <rect x="228" y="220" width="160" height="32" rx="8" fill="none" stroke="#3a4150"/>
  <text x="308" y="241" font-size="12" fill="#c8cdd8" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">Use an existing app</text>

  <text x="56" y="276" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">· First time: use "Scan to create an app" — that flow configures</text>
  <text x="56" y="292" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">  the permissions for you.</text>
  <text x="56" y="308" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">· Created one before: use "Use an existing app" and enter its App ID</text>
  <text x="56" y="324" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">  and App Secret.</text>

  <line x1="32" y1="344" x2="608" y2="344" stroke="#2a2f3a"/>

  <!-- escalation settings -->
  <text x="56" y="378" font-size="12.5" font-weight="600" fill="#c8cdd8" font-family="Segoe UI, Microsoft YaHei, Arial">Escalation</text>

  <text x="56" y="410" font-size="11" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">Desktop head start (seconds)</text>
  <rect x="404" y="394" width="184" height="30" rx="8" fill="#11141a" stroke="#3a4150"/>
  <text x="420" y="414" font-size="12" fill="#e8eaed" font-family="Consolas, Menlo, monospace">120</text>
  <text x="56" y="430" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">Seconds the desktop may answer before the same request is sent to the phone.</text>

  <text x="56" y="466" font-size="11" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">Title prefix</text>
  <rect x="404" y="450" width="184" height="30" rx="8" fill="#11141a" stroke="#3a4150"/>
  <text x="420" y="470" font-size="12" fill="#e8eaed" font-family="Consolas, Menlo, monospace">[laptop]</text>
  <text x="56" y="486" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">Prefix on every phone message title, for telling deployments apart.</text>

  <text x="56" y="520" font-size="11" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">Result notices</text>
  <rect x="404" y="504" width="88" height="30" rx="8" fill="#2a2f3a"/>
  <text x="448" y="524" font-size="11" fill="#e8eaed" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">When idle</text>
  <rect x="500" y="504" width="88" height="30" rx="8" fill="none" stroke="#3a4150"/>
  <text x="544" y="524" font-size="11" fill="#9aa3b2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">Off</text>
  <text x="56" y="540" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">After a session stops, send the turn result to the phone with a box to reply in.</text>

  <line x1="32" y1="562" x2="608" y2="562" stroke="#2a2f3a"/>

  <!-- pending: what the card says while a request is in flight -->
  <text x="56" y="594" font-size="12.5" font-weight="600" fill="#c8cdd8" font-family="Segoe UI, Microsoft YaHei, Arial">Pending</text>

  <text x="56" y="618" font-size="11" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">Tool approval</text>
  <rect x="540" y="604" width="68" height="20" rx="10" fill="#2a2f3a"/>
  <text x="574" y="618" font-size="9.5" fill="#9aa3b2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">phone</text>
  <text x="56" y="638" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">sent to the phone</text>

  <text x="56" y="668" font-size="11" fill="#9aa3b2" font-family="Segoe UI, Microsoft YaHei, Arial">Question</text>
  <rect x="540" y="654" width="68" height="20" rx="10" fill="#2a2f3a"/>
  <text x="574" y="668" font-size="9.5" fill="#9aa3b2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">desk</text>
  <text x="56" y="688" font-size="10.5" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">waiting on the desktop</text>

  <!-- annotation -->
  <text x="32" y="742" font-size="11" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">整张卡片只有一次扫码：凭据与接收人落在 credential store，之后每次 dsh 启动自己重连。</text>
  <text x="32" y="762" font-size="11" fill="#7c8698" font-family="Segoe UI, Microsoft YaHei, Arial">“Pending” 一栏是这张卡片的重点：每个还没结算的升级请求，都在这里说明它现在在哪一边。</text>

  <text x="32" y="800" font-size="10.5" fill="#5b6474" font-family="Segoe UI, Microsoft YaHei, Arial">样张 · 文案取自 client.js；录制真实截图时请把二维码、open_id 与实际凭据遮掉。</text>
</svg>
