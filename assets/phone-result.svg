<svg xmlns="http://www.w3.org/2000/svg" width="420" height="740" viewBox="0 0 420 740" role="img" aria-label="结果通知卡片：结果正文加一个回复框">
  <title>结果通知卡片（样张）</title>
  <defs>
    <clipPath id="screen"><rect x="52" y="24" width="316" height="652" rx="28"/></clipPath>
  </defs>

  <rect width="420" height="740" fill="#f4f5f7"/>
  <rect x="40" y="12" width="340" height="680" rx="40" fill="#1f2329"/>
  <rect x="52" y="24" width="316" height="652" rx="28" fill="#f7f8fa"/>

  <g clip-path="url(#screen)">
    <rect x="52" y="24" width="316" height="652" fill="#f7f8fa"/>
    <rect x="180" y="32" width="60" height="10" rx="5" fill="#1f2329" opacity="0.85"/>

    <text x="68" y="66" font-size="11" fill="#646a73" font-family="Segoe UI, Arial">21:07</text>
    <rect x="326" y="58" width="20" height="9" rx="3" fill="none" stroke="#646a73" stroke-width="1.4"/>
    <rect x="347" y="60" width="3" height="5" rx="1" fill="#646a73"/>

    <rect x="76" y="84" width="268" height="620" rx="14" fill="#ffffff" stroke="#e5e6eb"/>

    <text x="92" y="114" font-size="15" font-weight="600" fill="#1f2329" font-family="Segoe UI, Microsoft YaHei, Arial">结果</text>
    <text x="92" y="136" font-size="10.5" fill="#8f959e" font-family="Segoe UI, Microsoft YaHei, Arial">会话安静 120 秒后送达</text>

    <!-- the answer the Web GUI leaves unfolded: prose only, no tool chatter -->
    <text x="92" y="168" font-size="12" fill="#1f2329" font-family="Segoe UI, Microsoft YaHei, Arial">凭证校验的两条分支都跑通了：平台拒</text>
    <text x="92" y="186" font-size="12" fill="#1f2329" font-family="Segoe UI, Microsoft YaHei, Arial">绝的那一组返回 code 10014，正确的那</text>
    <text x="92" y="204" font-size="12" fill="#1f2329" font-family="Segoe UI, Microsoft YaHei, Arial">一组建立了长连接并报告 bound。下一步</text>
    <text x="92" y="222" font-size="12" fill="#1f2329" font-family="Segoe UI, Microsoft YaHei, Arial">要把这条路径写进 README 的限制一节。</text>

    <line x1="92" y1="248" x2="328" y2="248" stroke="#e5e6eb"/>

    <text x="92" y="274" font-size="11" fill="#646a73" font-family="Segoe UI, Microsoft YaHei, Arial">回复这条消息即可把下一步交给这个会话。</text>

    <rect x="92" y="292" width="236" height="72" rx="8" fill="#ffffff" stroke="#d0d3d9"/>
    <text x="104" y="314" font-size="11" fill="#a6a9b0" font-family="Segoe UI, Microsoft YaHei, Arial">写下下一步…</text>

    <rect x="240" y="330" width="88" height="28" rx="8" fill="#3370ff"/>
    <text x="284" y="348" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">发送给 agent</text>

    <!-- where the notice stops accepting a reply -->
    <rect x="92" y="392" width="236" height="56" rx="8" fill="#fffaf0" stroke="#f5d9a8"/>
    <text x="104" y="414" font-size="11" fill="#8a5a00" font-family="Segoe UI, Microsoft YaHei, Arial">有一条更新的结果发出后，这张卡片会</text>
    <text x="104" y="432" font-size="11" fill="#8a5a00" font-family="Segoe UI, Microsoft YaHei, Arial">改写为“已被取代”，不再接受回复。</text>

    <text x="92" y="486" font-size="10.5" fill="#8f959e" font-family="Segoe UI, Microsoft YaHei, Arial">通知只带这一轮的答案：过程中的工具调用</text>
    <text x="92" y="502" font-size="10.5" fill="#8f959e" font-family="Segoe UI, Microsoft YaHei, Arial">是 GUI 折叠起来的部分，通知不携带。</text>
  </g>

  <text x="210" y="716" font-size="11" fill="#8f959e" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial">这是通道唯一不阻塞的方向</text>
</svg>
