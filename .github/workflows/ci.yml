name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the harness engine range: ^22.19 || >=24.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # One setting lives in six places, and a published document must not link to a
      # file the tarball lacks; this refuses to pass unless Config, SectionSchema, the
      # card, both config pages, the bundle patch, and the published file list agree.
      - run: npm run check:parity
      # The suite stubs its five production dependencies through a resolution
      # hook, so there is nothing to install and no credentials or network.
      - run: npm test

  composition:
    name: real composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Only the application that installs the plugin proves it activates: a
      # hand-built context does not enforce Cordis's service rules, which is how
      # an undeclared service read once reached a user.
      #
      # The release is pinned, and so is the moment its dependencies are resolved at.
      # `dsh` reaches its subpackages — the boot library, the subprocess runner — through
      # caret ranges, so pinning `dsh` alone still let them float: when
      # `@deepseek-ai/dsh-app-boot@0.1.6-alpha.2` was published on 2026-09-17, this job went
      # red and stayed red, with `dsh plugin --profile web add` dying inside its own loader
      # on an import the boot library no longer provides. Naming the boot library as well
      # does not help: npm keeps the nested copy `dsh` resolved and adds a second one at the
      # root (the step below prints both, which is how that was found). `--before` is the
      # mechanism for this — resolve the tree as it stood when the pair was verified, so a
      # published dependency cannot change what this job verifies.
      - run: npm install -g @deepseek-ai/dsh@0.1.6-alpha.1 --before=2026-09-17T00:00:00Z
      # Which boot library `dsh` actually got is the fact the failure above hid, so the
      # job states it rather than leaving it to be inferred from a stack trace.
      - name: which boot library dsh got
        run: |
          root=$(npm root -g)
          for candidate in \
            "$root/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-app-boot/package.json" \
            "$root/@deepseek-ai/dsh-app-boot/package.json"
          do
            # A branch that finds nothing must not fail the step: only one of these
            # locations holds the copy, and which one it is is the answer.
            if [ -e "$candidate" ]; then node -p "require('$candidate').version + '  ' + '$candidate'"; fi
          done
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      # The tarball carries its transport, so the pack step needs installed deps.
      - run: pnpm install
      - run: npm run e2e

  package:
    name: publish payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Every path the manifest promises must exist, and every relative runtime
      # import must be reachable from the installed package.
      - name: Check the manifest and its declared files
        run: |
          node -e "
          const fs = require('node:fs');
          const pkg = require('./package.json');
          let failed = false;
          for (const file of pkg.files) {
            if (!fs.existsSync(file)) { console.error('missing from files:', file); failed = true; }
          }
          for (const [key, value] of Object.entries(pkg.exports)) {
            const target = typeof value === 'string' ? value : value.default;
            if (target !== undefined && !fs.existsSync(target)) {
              console.error('missing export target:', key, target); failed = true;
            }
          }
          if (pkg.dsh?.bundle?.patch && !fs.existsSync(pkg.dsh.bundle.patch)) {
            console.error('missing bundle patch:', pkg.dsh.bundle.patch); failed = true;
          }
          if (failed) process.exit(1);
          console.log('manifest verified');
          "
      # The published tarball must carry every runtime library it resolves; a profile that
      # installs it then resolves nothing that needs a build permission, which
      # is the whole reason the dependency is bundled rather than installed.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install what the tarball bundles
        run: pnpm install
      - name: Pack and assert the transport is inside the payload
        run: |
          pnpm pack
          tar -tzf dsh-pocket-console-*.tgz | grep -qx 'package/node_modules/@larksuiteoapi/node-sdk/package.json'
          tar -tzf dsh-pocket-console-*.tgz | grep -qx 'package/node_modules/protobufjs/package.json'
          tar -tzf dsh-pocket-console-*.tgz | grep -qx 'package/node_modules/qrcode/package.json'
          echo "bundled transport present"
