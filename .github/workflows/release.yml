name: Release

# Publishes through npm's trusted publishing: this job exchanges its GitHub
# OIDC identity for a short-lived publish credential, so no npm token exists in
# this repository, in a secret, or on a maintainer's machine. Two things must
# hold before it can work: the package must already exist on npm, and the
# package must name this workflow as its trusted publisher.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the tagged commit's check runs is how this job refuses a commit CI
      # never judged. Naming any permission sets the others to none, so this one has
      # to be listed even though it is only read.
      checks: read
      # What npm exchanges for the publish credential. Without it the registry
      # asks for a token this workflow deliberately does not have.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The ancestry check below needs `main` to exist in this checkout, and a
          # tag push by itself fetches one commit's worth of history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # No `registry-url` on purpose. Supplying it makes setup-node write an
          # `.npmrc` whose auth token is a placeholder, and npm then attempts a
          # token publish instead of the OIDC exchange this job exists for — on
          # Node 24 that ends in npm's own `Exit handler never called!` crash
          # after a successful pack. The default registry is npmjs.com, so the
          # only thing `registry-url` added here was a way to fail.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: pnpm install
      - name: npm must be new enough for a trusted publisher
        run: |
          node -e "const v = require('node:child_process').execSync('npm -v').toString().trim(); const [major, minor] = v.split('.').map(Number); console.log('npm', v); if (major < 11 || (major === 11 && minor < 5)) { console.error('npm ' + v + ' cannot publish through a trusted publisher (needs >= 11.5.1)'); process.exit(1) }"
      # Belt and braces: a publish that reaches the registry without a token is
      # what proves the OIDC exchange happened. A stray token in the environment
      # would silently turn this back into a token publish.
      - name: No publish token may be present
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "a publish token is set in the environment; this job must publish through OIDC instead"
            exit 1
          fi
          echo "no publish token present — the OIDC exchange is the only credential"
      # A manual run exists to retry a tag, not to publish whatever a branch
      # happens to hold, so both entries land on the same requirement.
      - name: The run must be the tag it publishes
        run: |
          node -e "
          const version = require('./package.json').version;
          if (process.env.GITHUB_REF_TYPE !== 'tag') {
            console.error('run this from a tag (v' + version + '), not from a branch');
            process.exit(1);
          }
          const tag = process.env.GITHUB_REF_NAME;
          if ('v' + version !== tag) {
            console.error('tag ' + tag + ' does not name version ' + version);
            process.exit(1);
          }
          console.log('tag names version', version);
          "
      # A tag is not a claim about a commit, it *is* a commit — and the repository's
      # ruleset lets the administrator bypass the pull-request and required-check rules
      # on purpose, so that a broken workflow can still be repaired. This job is the
      # half that cannot be bypassed. A release is tagged from a commit `main` holds,
      # and one CI actually judged.
      - name: The tagged commit must be on main
        run: |
          git fetch --quiet origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            echo "a release is tagged from a commit on main: merge the release pull request, then tag its squash commit"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"
      # The ruleset already required these four on the way into `main`. Asking again is
      # what makes the bypass safe rather than a hole: a commit that reached main
      # through the bypass has no green checks to point at, and this refuses it.
      - name: The tagged commit's checks must be green
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e "
          const commit = process.env.GITHUB_SHA
          const required = ['verify (node 22)', 'verify (node 24)', 'real composition', 'publish payload']
          const url = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/commits/' + commit + '/check-runs?per_page=100'
          const read = async () => {
            const response = await fetch(url, {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                'x-github-api-version': '2022-11-28',
              },
            })
            if (!response.ok) {
              console.error('could not read the check runs for ' + commit + ': ' + response.status + ' ' + (await response.text()).slice(0, 200))
              return false
            }
            const runs = (await response.json()).check_runs
            const problems = []
            for (const name of required) {
              const run = runs.find((candidate) => candidate.name === name)
              if (run === undefined) problems.push(name + ': no run on this commit')
              else if (run.status !== 'completed' || run.conclusion !== 'success') problems.push(name + ': ' + run.status + '/' + run.conclusion)
            }
            if (problems.length > 0) {
              console.error('the commit ' + commit + ' is not one CI has passed:')
              for (const problem of problems) console.error('  ' + problem)
              console.error('wait for main to be green, then tag the same commit again -- re-running this job does not change the answer')
              return false
            }
            console.log('all four checks passed on ' + commit)
            return true
          }
          // `process.exitCode` rather than `process.exit`: exiting while the fetch's
          // connection is still open trips a libuv assertion on Windows, and this step
          // has to fail cleanly on the platform a maintainer might run it from.
          read()
            .then((ok) => { if (!ok) process.exitCode = 1 })
            .catch((error) => { console.error(error); process.exitCode = 1 })
          "
      # One setting lives in six places, and the docs must not link to a file the
      # tarball lacks; publishing a disagreeing tree would ship the disagreement to
      # every deployment.
      - run: npm run check:parity
      - run: npm test
      # npm's own packer cannot pack this tree. `pnpm install` hard-links its store into
      # node_modules — `nodeLinker: hoisted` in pnpm-workspace.yaml controls the layout,
      # not how pnpm copies out of its store — and npm 11.19.0 dies on it with its own
      # `Exit handler never called!` before it writes anything, while npm 11.6.2 packs
      # hard-link entries the registry then refuses with `E415 Hard link is not allowed`.
      # Neither is about publishing, which is why the crash was so hard to place: it
      # happens before npm reaches the registry at all. `pnpm pack` writes the same
      # content with no link entries, so that is what builds the release, and `prepack`
      # still refuses a tarball this repository's own check would not accept.
      - name: Pack with the tool that packs this tree
        run: |
          pnpm pack
          version=$(node -p "require('./package.json').version")
          tgz="dsh-pocket-console-$version.tgz"
          test -f "$tgz" || { echo "pnpm pack produced no $tgz"; exit 1; }
          links=$(tar -tvf "$tgz" | grep -c '^h' || true)
          echo "$tgz: $(tar -tzf "$tgz" | wc -l) files, $links hard-link entries"
          # A hard-linked file in a package is a known supply-chain trick, and the
          # registry refuses the whole tarball for it.
          [ "$links" = "0" ] || { echo "the tarball carries hard links"; exit 1; }
      # Publishing the tarball is the half npm does correctly, and `--provenance` is why
      # it is npm at all: this is the one step that must carry the attestation.
      #
      # A version already on the registry is left alone. This is what makes re-running a
      # tag — the reason `workflow_dispatch` exists — possible after a failure that came
      # *after* the publish: without it the re-run dies on a duplicate version and the
      # release can never be seen to be good.
      - name: Publish the tarball with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-pocket-console@$version" version >/dev/null 2>&1; then
            echo "dsh-pocket-console@$version is already on the registry; nothing to publish"
            exit 0
          fi
          npm publish "./dsh-pocket-console-$version.tgz" --provenance
      # npm's own debug log is the only place a crash of its own names where it got to,
      # and it dies with the runner. Printing it costs nothing and is what identified the
      # packer as the culprit rather than the credentials.
      - name: npm's own log, when the publish failed
        if: failure()
        run: |
          for log in "$HOME"/.npm/_logs/*.log; do
            [ -e "$log" ] || continue
            echo "=================== $log"
            tail -n 40 "$log"
          done
      # Assert what the release claims, rather than trusting that the last step meant it:
      # the version has to be on the registry, and it has to carry the attestation this job
      # exists to produce.
      #
      # It waits, because the registry says so itself: "Your package is being processed and
      # may take a few minutes to become available". 0.8.0's publish signed its provenance
      # statement and reported success, and the version was still a 404 four minutes later —
      # reading once, immediately, turned a good release into a red run.
      - name: The registry carries this version, with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          published=""
          for attempt in $(seq 1 30); do
            # `npm view --json` answers a version the registry does not have yet with an
            # E404 *object* on stdout, and exits non-zero, so "the answer was not empty" is
            # not "the registry has it". The plain form prints the version itself, and the
            # exit status is what says whether it is there at all — which is the whole
            # question this loop is asking. 0.8.1's first run broke exactly here: the poll
            # took the error document for an answer and reported `published undefined@undefined`
            # for a release that had gone out perfectly well.
            published=$(npm view "dsh-pocket-console@$version" version 2>/dev/null || true)
            [ -n "$published" ] && break
            echo "attempt $attempt: the registry does not carry $version yet"
            sleep 10
          done
          [ -n "$published" ] || { echo "the registry never reported dsh-pocket-console@$version"; exit 1; }
          echo "the registry reports $published"
          meta=$(npm view "dsh-pocket-console@$version" --json)
          node -e "
          const meta = JSON.parse(process.argv[1]);
          console.log('published', meta.name + '@' + meta.version);
          const attestations = meta.dist && meta.dist.attestations;
          if (attestations === undefined || attestations === null) {
            console.error('the published version carries no provenance attestation');
            process.exit(1);
          }
          console.log('attestation present:', JSON.stringify(attestations).slice(0, 160));
          " "$meta"
