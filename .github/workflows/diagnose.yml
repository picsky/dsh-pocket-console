name: Diagnose publish

# Temporary: pins down why npm dies in this checkout, and checks the replacement path.
# Nothing is published — the only publish command is a dry run, and every other npm
# command is a local pack.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: where does npm die
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: pnpm install
      - name: runner and tool versions
        run: |
          node -v
          npm -v
          pnpm -v
      - name: is it the tree npm reads, or npm itself
        run: |
          set +e
          probe() {
            echo "=================== $1"
            shift
            "$@" > /tmp/probe.log 2>&1
            echo "exit: $?"
            grep -E 'npm error|npm notice|Exit handler' /tmp/probe.log | head -n 5
          }
          probe "pack with the pnpm tree in place" npm pack --dry-run
          probe "pack with the same tree through an older npm" npx --yes npm@11.6.2 pack --dry-run
          probe "pack with no node_modules at all" bash -c 'rm -rf node_modules && npm pack --dry-run'
      - name: the replacement path — pack with pnpm, publish the tarball with npm
        run: |
          set +e
          pnpm install
          pnpm pack > /tmp/pack.log 2>&1
          echo "pnpm pack exit: $?"
          tgz=$(ls *.tgz | head -n 1)
          echo "tarball: $tgz ($(tar -tzf "$tgz" | wc -l) files, $(tar -tvf "$tgz" | grep -c '^h' || true) hard links)"
          echo "=================== npm publish <tarball> --dry-run --provenance"
          npm publish "./$tgz" --dry-run --provenance > /tmp/pub.log 2>&1
          echo "exit: $?"
          tail -n 30 /tmp/pub.log
      - name: npm's own debug log
        if: always()
        run: |
          for log in /home/runner/.npm/_logs/*.log; do
            [ -e "$log" ] || continue
            if grep -q 'Exit handler' "$log"; then
              echo "=================== $log"
              grep -E 'verbose title|verbose argv|error|silly (config|idealTree|reify)' "$log" | head -n 25
            fi
          done
